<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#6b21a8">
<title>Açaí Obrigatório • Pedidos</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f5f3f7;color:#202024}
header{background:#6b21a8;color:#fff;padding:18px 16px 16px;position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:22px} header small{opacity:.85}
main{max-width:680px;margin:auto;padding:14px}
.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 2px 12px #0000000d}
label{font-size:13px;font-weight:700;display:block;margin:0 0 6px}
input,select,textarea{width:100%;border:1px solid #ddd;border-radius:10px;padding:12px;font-size:16px;background:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.product{display:grid;grid-template-columns:1fr 76px 90px;gap:8px;align-items:end;margin-bottom:10px}
.product button{height:44px}
button{border:0;border-radius:10px;padding:12px 14px;font-size:15px;font-weight:700;cursor:pointer}
.add{background:#eee;color:#333;width:100%}.remove{background:#fee2e2;color:#b91c1c}
.primary{background:#6b21a8;color:#fff;width:100%;font-size:17px}
.secondary{background:#eee;width:100%}
.total{font-size:25px;font-weight:800;text-align:right;margin-top:12px}
.row{display:flex;justify-content:space-between;gap:10px;margin:6px 0}
.muted{color:#666;font-size:13px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:430px){.grid{grid-template-columns:1fr}.product{grid-template-columns:1fr 72px 78px}}
@media print{
  body{background:#fff}
  header,main>.card:not(#receiptCard),.no-print{display:none!important}
  #receiptCard{display:block!important;box-shadow:none;padding:0;margin:0}
  #receipt{width:58mm;margin:0 auto;font-family:monospace;font-size:12px;color:#000}
}
#receiptCard{display:none}
#receipt{width:58mm;max-width:58mm}
.center{text-align:center}.line{border-top:1px dashed #000;margin:7px 0}
.rtotal{font-size:16px;font-weight:bold}.rtitle{font-size:16px;font-weight:bold}
</style>
</head>
<body>
<header>
  <h1>AÇAÍ OBRIGATÓRIO</h1>
  <small>Sistema simples de pedidos</small>
</header>

<main>
  <div class="card">
    <div class="grid">
      <div><label>Nº do pedido</label><input id="orderNo" readonly></div>
      <div><label>Data / hora</label><input id="dateTime" readonly></div>
    </div>
  </div>

  <div class="card">
    <label>Cliente</label>
    <input id="customer" placeholder="Nome do cliente">
    <br><br>
    <label>Observação</label>
    <textarea id="note" rows="2" placeholder="Ex.: sem colher, entregar na portaria..."></textarea>
  </div>

  <div class="card">
    <label>Produtos</label>
    <div id="products"></div>
    <button class="add" onclick="addProduct()">＋ Adicionar produto</button>
    <div class="total">R$ <span id="total">0,00</span></div>
  </div>

  <div class="card">
    <label>Pagamento</label>
    <select id="payment">
      <option>Pix</option>
      <option>Dinheiro</option>
      <option>Cartão</option>
      <option>Não informado</option>
    </select>
  </div>

  <div class="card no-print">
    <div class="actions">
      <button class="secondary" onclick="clearOrder()">Limpar</button>
      <button class="primary" onclick="printReceipt()">🖨️ Imprimir</button>
    </div>
    <p class="muted" style="margin-bottom:0">
      A impressão usa a função de impressão do iPad. A BT-583 é uma impressora ESC/POS Bluetooth; o Safari não envia ESC/POS diretamente por Bluetooth.
    </p>
  </div>

  <div id="receiptCard">
    <div id="receipt"></div>
  </div>
</main>

<script>
const products = [
  {name:"Açaí 300 ml — Mousse de maracujá", price:15},
  {name:"Açaí 300 ml — Ninho e Nutella", price:15},
  {name:"Açaí 300 ml — Paçoca", price:15},
  {name:"Açaí Fit 300 ml", price:20},
  {name:"Frozem 300 ml", price:20}
];

let items=[];

function money(v){return v.toFixed(2).replace(".",",")}
function now(){
  const d=new Date();
  return d.toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"});
}
function nextNumber(){
  let n=Number(localStorage.getItem("pedidoNumero")||0)+1;
  localStorage.setItem("pedidoNumero",n);
  return String(n).padStart(4,"0");
}
function setup(){
  document.getElementById("orderNo").value=nextNumber();
  document.getElementById("dateTime").value=now();
  addProduct();
}
function addProduct(){
  items.push({product:products[0].name,qty:1,price:products[0].price});
  render();
}
function removeItem(i){items.splice(i,1);if(!items.length)addProduct();render()}
function render(){
  const box=document.getElementById("products");
  box.innerHTML="";
  items.forEach((it,i)=>{
    const div=document.createElement("div");
    div.className="product";
    div.innerHTML=`
      <div>
        <label>Produto</label>
        <select onchange="items[${i}].product=this.value;items[${i}].price=products.find(p=>p.name===this.value).price;render()">
          ${products.map(p=>`<option ${p.name===it.product?"selected":""}>${p.name}</option>`).join("")}
        </select>
      </div>
      <div><label>Qtd.</label><input type="number" min="1" value="${it.qty}" onchange="items[${i}].qty=Math.max(1,Number(this.value));render()"></div>
      <button class="remove" onclick="removeItem(${i})">Excluir</button>`;
    box.appendChild(div);
  });
  const total=items.reduce((s,i)=>s+i.qty*i.price,0);
  document.getElementById("total").textContent=money(total);
}
function buildReceipt(){
  const customer=document.getElementById("customer").value.trim()||"Consumidor";
  const note=document.getElementById("note").value.trim();
  const payment=document.getElementById("payment").value;
  const no=document.getElementById("orderNo").value;
  const dt=document.getElementById("dateTime").value;
  const total=items.reduce((s,i)=>s+i.qty*i.price,0);

  let html=`
    <div class="center rtitle">AÇAÍ OBRIGATÓRIO</div>
    <div class="center">PEDIDO ${no}</div>
    <div class="center">${dt}</div>
    <div class="line"></div>
    <b>CLIENTE:</b> ${escapeHtml(customer)}<br>
    <div class="line"></div>`;

  items.forEach(i=>{
    html+=`${i.qty}x ${escapeHtml(i.product)}<br><span style="display:block;text-align:right">R$ ${money(i.qty*i.price)}</span>`;
  });

  html+=`<div class="line"></div>
    <div class="row"><b>TOTAL</b><b>R$ ${money(total)}</b></div>
    <div>Pagamento: ${escapeHtml(payment)}</div>`;
  if(note) html+=`<div class="line"></div><b>OBS:</b><br>${escapeHtml(note)}`;
  html+=`<div class="line"></div><div class="center">Obrigado pela preferência!</div><br><br><br>`;
  document.getElementById("receipt").innerHTML=html;
}
function escapeHtml(s){
  return s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
}
function printReceipt(){
  buildReceipt();
  document.getElementById("receiptCard").style.display="block";
  setTimeout(()=>window.print(),150);
}
function clearOrder(){
  if(!confirm("Limpar este pedido?"))return;
  items=[];
  document.getElementById("customer").value="";
  document.getElementById("note").value="";
  document.getElementById("payment").value="Pix";
  document.getElementById("orderNo").value=nextNumber();
  document.getElementById("dateTime").value=now();
  addProduct();
}
window.addEventListener("afterprint",()=>{
  document.getElementById("receiptCard").style.display="none";
});
setup();
</script>
</body>
</html>
